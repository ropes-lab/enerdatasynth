[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enerdatasynth"
dynamic = ["version"]
description = "A research SDK for synthetic PJM energy resource profiles (electric load today; a common interface for future resource types)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sonakshi Sharma", email = "s.sonakshi2006@gmail.com" },
]
requires-python = ">=3.9"
keywords = ["diffusion-model", "synthetic-data", "electric-load", "pjm", "time-series", "energy", "generative-model", "research-sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "statsmodels",
    "holidays",
    "matplotlib",
    "requests",
    "tqdm",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
viz = [
    "seaborn>=0.13",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[project.scripts]
enerdatasynth = "enerdatasynth.cli:main"

[tool.setuptools.dynamic]
version = { attr = "enerdatasynth.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

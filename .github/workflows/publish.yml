name: publish

# Publishes to PyPI via Trusted Publishing (OIDC) -- no stored API token.
# Before this can succeed, a PyPI project owner must link this workflow
# as a trusted publisher: https://pypi.org/manage/project/enerdatasynth/settings/publishing/
# (Owner: ropes-lab, Repo: enerdatasynth, Workflow: publish.yml, Environment: pypi)
#
# Triggers on pushing a version tag (v0.5.0, v0.5.1, ...) or manually via
# the Actions tab (workflow_dispatch) for a dry run / re-publish attempt
# without needing a new tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Verify PyPI metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
